name: Build Windows release

# Pull requests: build the exe and attach it to the run (no release).
# Merge to main (desktop/package/release-notes changes), a v* tag, or a manual run: build and publish the pre-release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths: ["package.json", "package-lock.json", "desktop/**", "docs/release-notes/**", ".github/workflows/release.yml", "*.js", "lib/**", "data/**", "index.html", "styles.css", "winscan.ps1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          test -f "docs/release-notes/v$V.md" || { echo "missing docs/release-notes/v$V.md"; exit 1; }
      - name: Core and static tests
        run: npm test
      - name: Build Windows installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIDItest-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MIDItest ${{ steps.ver.outputs.version }}
          body_path: docs/release-notes/v${{ steps.ver.outputs.version }}.md
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          files: |
            dist/MIDItest-Setup-${{ steps.ver.outputs.version }}-x64.exe
            dist/MIDItest-${{ steps.ver.outputs.version }}-x64-portable.exe
          fail_on_unmatched_files: true
