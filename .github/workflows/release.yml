name: Build Windows release

# Runs on a v* tag, a manual dispatch, or any push whose commit message contains [release].
# The release tag is v<package.json version>; the action creates it if it does not exist.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Build portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MIDItest-windows
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create release tag
        shell: bash
        run: |
          TAG='${{ steps.ver.outputs.tag }}'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MIDItest ${{ steps.ver.outputs.tag }}
          prerelease: true
          files: dist/*.exe
          body: |
            MIDItest desktop beta for Windows 10/11 (portable .exe – no install needed, just run it).
            New: Device Tests tab with a per-device test database for NI Maschine MK1, Novation 25 SL MkII, M-Audio Ozone, Focusrite Scarlett 2i2, Rane TWELVE MKII, Pioneer DJ PLX-CRSS12 and Pioneer DJ DJM-A9.
            The exe is unsigned, so Windows SmartScreen may warn: click "More info" → "Run anyway".
