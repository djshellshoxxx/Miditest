name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core and static tests
        run: npm test
      - name: Build Windows installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIDItest-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MIDItest 0.01 Beta
          body_path: docs/release-notes/v0.01-beta.md
          prerelease: true
          files: |
            dist/MIDItest-Setup-0.01-beta-x64.exe
            dist/MIDItest-0.01-beta-x64-portable.exe
          fail_on_unmatched_files: true
