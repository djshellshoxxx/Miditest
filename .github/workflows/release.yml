name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Build portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MIDItest-windows
          path: dist/*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MIDItest ${{ github.ref_name }}
          prerelease: true
          files: dist/*.exe
          body: |
            MIDItest desktop beta for Windows 10/11 (portable .exe – no install needed, just run it).
            New: Device Tests tab with a per-device test database for NI Maschine MK1, Novation 25 SL MkII, M-Audio Ozone, Focusrite Scarlett 2i2, Rane TWELVE MKII, Pioneer DJ PLX-CRSS12 and Pioneer DJ DJM-A9.
            The exe is unsigned, so Windows SmartScreen may warn: click "More info" → "Run anyway".
