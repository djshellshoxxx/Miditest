name: Native Plugin

on:
  push:
    branches: ["port/vst3-clap"]
    paths:
      - "plugin/**"
      - ".github/workflows/native-plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/native-plugin.yml"
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S plugin -B plugin/build -DMIDITEST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build plugin/build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      - name: Verify VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem plugin/build -Recurse -Filter "MIDItest.vst3" | Select-Object -First 1
          if (-not $vst) { throw "MIDItest.vst3 was not produced" }
          "VST3=$($vst.FullName)"

      - name: Verify CLAP
        shell: pwsh
        run: |
          $clap = Get-ChildItem plugin/build -Recurse -Filter "MIDItest.clap" | Select-Object -First 1
          if (-not $clap) { throw "MIDItest.clap was not produced" }
          "CLAP=$($clap.FullName)"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force plugin/dist | Out-Null
          Get-ChildItem plugin/build -Recurse -Filter "MIDItest.vst3" | ForEach-Object { Copy-Item $_.FullName plugin/dist -Recurse -Force }
          Get-ChildItem plugin/build -Recurse -Filter "MIDItest.clap" | ForEach-Object { Copy-Item $_.FullName plugin/dist -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: MIDItest-Windows-alpha
          path: plugin/dist/*
          if-no-files-found: error
