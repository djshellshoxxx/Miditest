name: Test and deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core diagnostics tests
        run: node tests/core.test.mjs
      - name: Static UI contract
        run: node tests/ui-static.test.mjs
      - name: Device test database and engine
        run: node tests/device-tests.test.mjs
      - name: Parse browser modules
        run: |
          node --input-type=module --check < app-v2.js
          node --input-type=module --check < midi-core.js
          node --input-type=module --check < device-tests.js
          node --input-type=module --check < device-tests-core.js

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
